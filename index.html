<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xindus Approval Request</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  body { font-family: Arial, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 22px; }
  label { display: block; margin-top: 14px; font-weight: bold; font-size: 14px; }
  input, select, textarea {
    width: 100%; box-sizing: border-box; padding: 9px; margin-top: 4px;
    border: 1px solid #ccc; border-radius: 4px; font-size: 14px;
  }
  textarea { resize: vertical; }
  button {
    margin-top: 22px; padding: 12px 28px; background: #188038; color: #fff;
    border: none; border-radius: 5px; font-weight: bold; font-size: 15px; cursor: pointer;
  }
  button:disabled { background: #999; cursor: not-allowed; }
  .section { display: none; }
  .section.active { display: block; }
  #status { margin-top: 16px; font-size: 14px; }
  .error { color: #d93025; }
  .success { color: #188038; }
</style>
</head>
<body>

<h1>Xindus — Approval Request</h1>

<!-- ============================================================
     EDIT THESE VALUES before publishing:
     - SUPABASE_URL / SUPABASE_ANON_KEY: from Supabase project settings
       (Settings → API). The anon key is safe to expose here — it can
       ONLY insert rows, per the RLS policy in schema.sql.
     - SEND_EMAIL_FUNCTION_URL: your deployed send-approval-email
       Edge Function URL.

     ------------------------------------------------------------
     APPROVER ROUTING (amount-based, from the credit approval matrix):
     There is no "Approver Email / Name / CC" field on the form any more.
     They are looked up from the ROUTING table below using:
       - the approval type, and
       - an amount taken from the form (see getRoutingAmount()).
     To change an approver / CC / add a tier: edit the ROUTING table.
     If no tier matches (e.g. Insurer Rejection has no rows yet, or the
     amount is above the top tier) the DEFAULT_APPROVER_EMAIL is used.
     ============================================================ -->
<script>
  const SUPABASE_URL = "https://mhvxlgqkfxghpkjfvude.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1odnhsZ3FrZnhnaHBramZ2dWRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyMjEyNjAsImV4cCI6MjEwNTc5NzI2MH0.PqRFxJXWgqXahvNKTQwiCKWDPSVH8DYNHUEhVWM7Pwo";
  const SEND_EMAIL_FUNCTION_URL = "https://mhvxlgqkfxghpkjfvude.supabase.co/functions/v1/send-approval-email";

  // Fallback when no tier matches.
  const DEFAULT_APPROVER_EMAIL = "vikas.p@xindus.net";

  // Routing matrix. Tiers are checked from lowest to highest: the first
  // tier whose "to" is >= the amount wins.  ("from" is for reference.)
  const APPROVER = "vikas.p@xindus.net";
  const CC = "roshan@xindus.net";
  const ROUTING = {
    "credit limit extension": [
      { from: 0,      to: 100000, email: APPROVER, name: "",           cc: CC },
      { from: 100001, to: 200000, email: APPROVER, name: "Shifty mam", cc: CC },
      { from: 200001, to: 300000, email: APPROVER, name: "Mohit Sir",  cc: CC },
      { from: 300001, to: 400000, email: APPROVER, name: "",           cc: CC },
      { from: 400001, to: 500000, email: APPROVER, name: "",           cc: CC },
      { from: 500001, to: 600000, email: APPROVER, name: "",           cc: CC },
    ],
    "temporary credit - insurer approval under process": [
      { from: 0,      to: 100000, email: APPROVER, name: "Roshan Sir", cc: CC },
      { from: 100001, to: 200000, email: APPROVER, name: "Shifty mam", cc: CC },
      { from: 200001, to: 300000, email: APPROVER, name: "Mohit Sir",  cc: CC },
      { from: 300001, to: 400000, email: APPROVER, name: "",           cc: CC },
      { from: 400001, to: 500000, email: APPROVER, name: "",           cc: CC },
      { from: 500001, to: 600000, email: APPROVER, name: "",           cc: CC },
    ],
    // No rows in the matrix yet -> uses DEFAULT_APPROVER_EMAIL.
    "insurer rejection - credit limit exception": [],
  };

  function toNumber(v) {
    const n = parseFloat(String(v || "").replace(/[^0-9.]/g, ""));
    return isNaN(n) ? null : n;
  }

  // Which form field(s) decide the tier, per approval type.
  function getRoutingAmount(approvalType, d) {
    if (approvalType === "credit limit extension") {
      const cur = toNumber(d.current_credit_limit);
      const add = toNumber(d.additional_credit_requested);
      if (cur === null || add === null) return null;
      return cur + add; // total new limit
    }
    if (approvalType === "temporary credit - insurer approval under process") {
      return toNumber(d.credit_limit_required);
    }
    if (approvalType === "insurer rejection - credit limit exception") {
      return toNumber(d.credit_limit_requested);
    }
    return null;
  }

  function resolveRouting(approvalType, amount) {
    const tiers = ROUTING[approvalType] || [];
    const tier = amount === null ? null : tiers.find(t => amount <= t.to);
    return tier || { email: DEFAULT_APPROVER_EMAIL, name: "", cc: "" };
  }
</script>

<form id="approvalForm">

  <label for="approvalType">Approval Type</label>
  <select id="approvalType" required>
    <option value="">-- Select --</option>
    <option value="credit limit extension">Credit Limit Extension</option>
    <option value="insurer rejection - credit limit exception">Insurer Rejection – Credit Limit Exception</option>
    <option value="temporary credit - insurer approval under process">Temporary Credit – Insurer Approval Under Process</option>
  </select>

  <!-- Section: Credit Limit Extension -->
  <div class="section" data-type="credit limit extension">
    <label>Customer ID / Name</label><input data-field="customer_id_name">
    <label>Reason for Credit Limit Enhancement</label><textarea rows="2" data-field="reason"></textarea>
    <label>Current Credit Limit</label><input data-field="current_credit_limit">
    <label>Current Outstanding</label><input data-field="current_outstanding">
    <label>Ageing of Overdue</label><input data-field="ageing_overdue" placeholder="e.g. 30 days">
    <label>Tentative Clearance Date</label><input type="date" data-field="tentative_clearance_date">
    <label>Overdue Amount, if any</label><input data-field="overdue_amount">
    <label>Additional Credit Requested</label><input data-field="additional_credit_requested">
    <label>Sales Owner / KAM</label><input data-field="sales_owner_kam">
  </div>

  <!-- Section: Insurer Rejection – Credit Limit Exception -->
  <div class="section" data-type="insurer rejection - credit limit exception">
    <label>Customer Name</label><input data-field="customer_name">
    <label>Sales POC Name</label><input data-field="sales_poc_name">
    <label>Credit Limit Requested</label><input data-field="credit_limit_requested">
    <label>Credit Requirement</label>
    <select data-field="credit_requirement"><option value="">--</option><option>Temporary</option><option>Ongoing</option></select>
    <label>Risk of Losing Customer/Business</label>
    <select data-field="risk_of_losing_customer"><option value="">--</option><option>Yes</option><option>No</option></select>
    <label>Customer Willing to Continue on Prepaid Terms</label>
    <select data-field="customer_willing_prepaid"><option value="">--</option><option>Yes</option><option>No</option></select>
    <label>Reason for Credit Requirement</label><textarea rows="2" data-field="reason_for_credit_requirement"></textarea>
    <label>Expected Payment Timeline</label><input data-field="expected_payment_timeline">
  </div>

  <!-- Section: Temporary Credit – Insurer Approval Under Process -->
  <div class="section" data-type="temporary credit - insurer approval under process">
    <label>Customer Name</label><input data-field="customer_name">
    <label>Sales POC Name</label><input data-field="sales_poc_name">
    <label>Customer Type</label>
    <select data-field="customer_type"><option value="">--</option><option>New</option><option>Existing</option></select>
    <label>Customer Onboarding Date</label><input type="date" data-field="customer_onboarding_date">
    <label>Credit Limit Required</label><input data-field="credit_limit_required">
    <label>Reason for Credit Requirement Before Insurer Approval</label>
    <textarea rows="2" data-field="reason_before_insurer_approval"></textarea>
    <label>Expected First Payment Date</label><input type="date" data-field="expected_first_payment_date">
    <label>Credit to be Blocked After Temporary Approval Expiry</label>
    <select data-field="credit_blocked_after_expiry"><option value="">--</option><option>Yes</option><option>No</option></select>
  </div>

  <button type="submit" id="submitBtn">Submit Request</button>
  <div id="status"></div>

</form>

<script>
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: false, autoRefreshToken: false }
  });

  const typeSelect = document.getElementById("approvalType");
  const sections = document.querySelectorAll(".section");

  typeSelect.addEventListener("change", () => {
    sections.forEach(s => s.classList.toggle("active", s.dataset.type === typeSelect.value));
  });

  document.getElementById("approvalForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const statusEl = document.getElementById("status");
    const submitBtn = document.getElementById("submitBtn");
    statusEl.textContent = "";
    statusEl.className = "";

    const approvalType = typeSelect.value;
    if (!approvalType) {
      statusEl.textContent = "Please select an approval type.";
      statusEl.className = "error";
      return;
    }

    const activeSection = document.querySelector(`.section[data-type="${approvalType}"]`);
    const requestData = {};
    activeSection.querySelectorAll("[data-field]").forEach(el => {
      requestData[el.dataset.field] = el.value.trim();
    });

    const amount = getRoutingAmount(approvalType, requestData);
    if ((ROUTING[approvalType] || []).length && amount === null) {
      statusEl.textContent = "Please enter the credit amount(s) as plain numbers (e.g. 150000).";
      statusEl.className = "error";
      return;
    }
    const route = resolveRouting(approvalType, amount);

    const payload = {
      approval_type: approvalType,
      approver_email: route.email,
      approver_name: route.name || null,
      cc_email: route.cc || null,
      request_data: requestData,
    };

    submitBtn.disabled = true;
    statusEl.textContent = "Submitting...";

    try {
      const { data, error } = await supabaseClient
        .from("approval_requests")
        .insert(payload)
        .select("id")
        .single();

      if (error) throw error;

      // Fire the email-sending function; don't block the success message on it.
      fetch(SEND_EMAIL_FUNCTION_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: data.id }),
      }).catch(err => console.error("Email trigger failed:", err));

      statusEl.textContent = "Request submitted! An approval email has been sent.";
      statusEl.className = "success";
      e.target.reset();
      sections.forEach(s => s.classList.remove("active"));

    } catch (err) {
      console.error(err);
      statusEl.textContent = "Something went wrong: " + err.message;
      statusEl.className = "error";
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
