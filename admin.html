<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xindus — Admin Approval Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f8f9fa; }
    h1 { color: #188038; }
    .controls { margin-bottom: 20px; display: flex; gap: 10px; }
    select, input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    table { width: 100%; border-collapse: collapse; background: white; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; font-size: 14px; }
    th { background-color: #f1f3f4; }
    .badge { padding: 4px 10px; border-radius: 12px; font-weight: bold; font-size: 12px; text-transform: uppercase; }
    .badge-pending { background: #fef7e0; color: #b06000; }
    .badge-approved { background: #e6f4ea; color: #137333; }
    .badge-rejected { background: #fce8e6; color: #c5221f; }
  </style>
</head>
<body>

  <h1>Admin Approval Tracking Dashboard</h1>

  <div class="controls">
    <select id="statusFilter">
      <option value="ALL">All Status</option>
      <option value="Pending">Pending</option>
      <option value="Approved">Approved</option>
      <option value="Rejected">Rejected</option>
    </select>
    <button onclick="loadRequests()" style="padding: 8px 16px; background:#188038; color:white; border:none; border-radius:4px; cursor:pointer;">Refresh</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Request ID</th>
        <th>Approval Type</th>
        <th>Approver Email</th>
        <th>Status</th>
        <th>Remarks</th>
        <th>Submitted Date</th>
      </tr>
    </thead>
    <tbody id="requestsTable">
      <tr><td colspan="6">Loading requests...</td></tr>
    </tbody>
  </table>

<script>
  const SUPABASE_URL = "https://mhvxlgqkfxghpkjfvude.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1odnhsZ3FrZnhnaHBramZ2dWRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyMjEyNjAsImV4cCI6MjEwNTc5NzI2MH0.PqRFxJXWgqXahvNKTQwiCKWDPSVH8DYNHUEhVWM7Pwo";
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function loadRequests() {
    const tbody = document.getElementById("requestsTable");
    const filter = document.getElementById("statusFilter").value;
    tbody.innerHTML = "<tr><td colspan='6'>Loading...</td></tr>";

    let query = supabaseClient.from("approval_requests").select("*").order("created_at", { ascending: false });
    if (filter !== "ALL") {
      query = query.eq("status", filter);
    }

    const { data, error } = await query;

    if (error || !data) {
      tbody.innerHTML = `<tr><td colspan='6' style='color:red;'>Error loading data: ${error?.message}</td></tr>`;
      return;
    }

    if (data.length === 0) {
      tbody.innerHTML = "<tr><td colspan='6'>No requests found.</td></tr>";
      return;
    }

    tbody.innerHTML = data.map(req => `
      <tr>
        <td><strong>#${req.id.slice(0, 8)}</strong></td>
        <td>${req.approval_type || '-'}</td>
        <td>${req.approver_email || '-'}</td>
        <td><span class="badge badge-${(req.status || 'pending').toLowerCase()}">${req.status || 'Pending'}</span></td>
        <td>${req.remarks || '-'}</td>
        <td>${new Date(req.created_at).toLocaleString()}</td>
      </tr>
    `).join('');
  }

  document.getElementById("statusFilter").addEventListener("change", loadRequests);
  loadRequests();
</script>

</body>
</html>
