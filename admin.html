<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xindus Credit Approval Admin Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f6f8; }
    .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; }
    h2 { color: #1b5e20; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background-color: #f2f2f2; }
    .btn-reminder { background-color: #ff9800; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    .btn-reminder:hover { background-color: #e68a00; }
  </style>
</head>
<body>

<div class="container">
  <h2>Approval Requests Tracking</h2>
  <button onclick="fetchRequests()">🔄 Refresh Data</button>

  <table>
    <thead>
      <tr>
        <th>Customer ID / Name</th>
        <th>Additional Credit Required</th>
        <th>Approval Type</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="requestsTableBody">
      <!-- Dynamic Rows -->
    </tbody>
  </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://mhvxlgkfxghpkjfvude.supabase.co'; // Replace with actual Supabase URL
  const SUPABASE_ANON_KEY = 'sb_publishable_jOedpjipxRUlzsisHe1yqg_4gWCjqNM'; // Replace with actual Anon Key
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function fetchRequests() {
    const { data, error } = await supabaseClient
      .from('approval_requests')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      alert("Error fetching data: " + error.message);
      return;
    }

    const tbody = document.getElementById('requestsTableBody');
    tbody.innerHTML = '';

    data.forEach(req => {
      const customer = req.customer_id_name || req.customer_name || req.company_name || 'N/A';
      const amount = req.additional_credit_requested || req.credit_limit || req.amount || 0;
      const formattedAmount = Number(amount).toLocaleString('en-IN');

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${customer}</td>
        <td>₹${formattedAmount}</td>
        <td>${req.approval_type || '-'}</td>
        <td>${req.status || 'Pending'}</td>
        <td>
          <button onclick="sendReminder('${req.id}')" class="btn-reminder">🔔 Send Reminder</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  async function sendReminder(requestId) {
    if (!confirm("Are you sure you want to send a reminder email?")) return;

    try {
      const response = await fetch(`${SUPABASE_URL}/functions/v1/send-approval-email`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
        },
        body: JSON.stringify({ id: requestId, isReminder: true })
      });

      const result = await response.json();
      if (response.ok) {
        alert("✅ REMINDER EMAIL successfully dispatched to approver!");
      } else {
        alert("❌ Failed to send reminder: " + JSON.stringify(result));
      }
    } catch (err) {
      alert("Error: " + err.message);
    }
  }

  window.onload = fetchRequests;
</script>

</body>
</html>
